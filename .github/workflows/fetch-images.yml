name: Fetch AudioJungle profile images
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch-images.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download banners
        run: |
          set -e
          mkdir -p banners
          C=https://camo.envatousercontent.com
          WB=https://web.archive.org/web
          dl() {
            for u in "$2" "$3"; do
              if curl -fsSL --retry 4 --retry-delay 5 -m 60 -A "Mozilla/5.0" -o "banners/$1" "$u" && file "banners/$1" | grep -q image; then
                echo "OK $1 <- $u"; return 0; fi
            done
            echo "FAILED $1"; return 1
          }
          dl 01-music.jpg https://pp.userapi.com/c844416/v844416258/236c6/w8u5bc13Fro.jpg $C/b6cc2ef0b6131ab6844ede7d18776fcd7654c75c/68747470733a2f2f70702e757365726170692e636f6d2f633834343431362f763834343431363235382f32333663362f773875356263313346726f2e6a7067
