          ls -la banners
      - name: Build reference layout
        run: |
          pip install --quiet pillow
          mkdir -p reference
          python3 - <<'PY'
          from PIL import Image
          b = lambda n: Image.open(f"banners/{n}").convert("RGB")
          W, gap, step = 620, 5, 58
          rows = [["01-music.jpg"], ["02-music-packs-kits.jpg"],
                  ["03-menu-sfx.jpg", "04-logos.jpg"],
                  ["05-sfx-packs.jpg", "06-casual-games.jpg"],
                  ["07-melodic-sfx.jpg", "08-strategy-rpg.jpg"],
                  ["09-industrial-sfx.jpg", "10-futuristic-sfx.jpg"],
                  ["11-impact-explosion.jpg", "12-whoosh-transition.jpg"]]
          canvas = Image.new("RGB", (W, step * len(rows)), "white")
          for i, row in enumerate(rows):
              x = 0
              for n in row:
                  im = b(n)
                  canvas.paste(im, (x, i * step))
                  x += im.width + gap
          canvas.save("reference/menu-layout-desktop.png")
          print(canvas.size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add banners reference
          git commit -m "Add AudioJungle profile banners and reference layout" || echo "nothing to commit"
          git push
